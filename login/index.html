<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 — 노슈니 (NOSHOONI)</title>
<meta name="description" content="노슈니 회원 로그인. 구글 또는 카카오 계정으로 바로 시작할 수 있습니다." />
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://noshooni.com/login" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{--bg:#0e0e10;--bg-2:#141317;--purple:#7c3aed;--purple-lt:#a78bfa;
--cream:#f0ecff;--text:#e9e6f2;--muted:#98929f;--faint:#6c6674;
--line:rgba(240,236,255,.12);--line-2:rgba(240,236,255,.22);--ease:cubic-bezier(.16,1,.3,1);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:"Inter","Pretendard",sans-serif;
letter-spacing:-.02em;line-height:1.7;-webkit-font-smoothing:antialiased;
min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;} img{display:block;max-width:100%;}
::selection{background:var(--purple);color:#fff;}
.mono{font-family:"Inter",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;}
:focus-visible{outline:2px solid var(--purple-lt);outline-offset:3px;border-radius:6px;}

header.site{display:flex;justify-content:center;padding:30px 24px;}
header.site img{height:24px;width:auto;}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 70px;}
.card{width:100%;max-width:396px;}
.eb{color:var(--purple-lt);text-align:center;margin-bottom:14px;}
h1{font-size:clamp(28px,5vw,34px);font-weight:800;letter-spacing:-.04em;line-height:1.2;
color:var(--cream);text-align:center;}
.lede{color:var(--muted);font-size:15px;text-align:center;margin-top:14px;}

.buttons{margin-top:38px;display:flex;flex-direction:column;gap:11px;}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
padding:15px 18px;border:none;border-radius:12px;cursor:pointer;
font-family:inherit;font-size:15.5px;font-weight:700;letter-spacing:-.02em;
transition:transform .2s var(--ease),opacity .2s var(--ease);}
.sso:hover{transform:translateY(-1px);} .sso:active{transform:none;}
.sso[disabled]{opacity:.5;cursor:default;transform:none;}
.sso svg{width:19px;height:19px;flex:none;}
.sso.google{background:#fff;color:#1f1f1f;}
.sso.kakao{background:#FEE500;color:rgba(0,0,0,.85);}

.msg{margin-top:20px;padding:13px 15px;border-radius:10px;font-size:14px;line-height:1.65;
border:1px solid var(--line-2);background:var(--bg-2);color:var(--muted);}
.msg.err{border-color:rgba(255,120,120,.4);color:#ffb3b3;}

.note{margin-top:26px;color:var(--faint);font-size:12.5px;line-height:1.8;text-align:center;}
.note a{color:var(--muted);text-decoration:underline;text-underline-offset:3px;}
.back{margin-top:30px;text-align:center;}
.back a{color:var(--faint);font-size:13px;}
.back a:hover{color:var(--purple-lt);}

footer.site{padding:22px 24px 34px;text-align:center;}
footer.site .mono{color:var(--faint);}
</style>
</head>
<body>

<header class="site">
  <a href="/" aria-label="NOSHOONI"><img decoding="async" width="427" height="89" src="/images/noshooni-5f95636263.webp" alt="NOSHOONI" /></a>
</header>

<main>
  <div class="card">
    <p class="eb mono">Members</p>
    <h1>노슈니 회원으로<br />시작하기</h1>
    <p class="lede">비밀번호는 따로 만들지 않습니다.<br />평소 쓰시는 계정으로 바로 들어오세요.</p>

    <p class="msg" id="msg" hidden></p>

    <div class="buttons">
      <button class="sso google" id="google" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-2.8-.4-4.1H24v8.4h12.6c-.3 2.1-1.6 5.2-4.7 7.3l7.6 5.9c4.5-4.2 6.6-10.3 6.6-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.6 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.5-5.8l-7.6-5.9c-2 1.4-4.7 2.4-7.9 2.4-6.3 0-11.7-3.7-13.6-9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        구글로 로그인
      </button>

      <button class="sso kakao" id="kakao" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.9 3 2.8 6.3 2.8 10.3c0 2.6 1.7 4.9 4.3 6.2l-1 3.7c-.1.3.2.6.5.4l4.4-2.9c.3 0 .7.1 1 .1 5.1 0 9.2-3.3 9.2-7.5S17.1 3 12 3z"/></svg>
        카카오로 로그인
      </button>
    </div>

    <p class="note">
      로그인하면 <a href="/privacy">개인정보 처리방침</a>에 동의하는 것으로 봅니다.<br />
      이름·이메일·프로필 사진만 받고, 비밀번호는 저장하지 않습니다.
    </p>

    <p class="back"><a href="/">← 노슈니 홈으로</a></p>
  </div>
</main>

<footer class="site">
  <span class="mono">© 2026 노슈니 (NOSHOONI)</span>
</footer>

<script type="module">
import { 로그인, 현재회원, 에러문구 } from "/js/auth.js";

const 쪽지 = document.getElementById("msg");
const 버튼들 = ["google", "kakao"].map((id) => document.getElementById(id)).filter(Boolean);

function 알림(글, 종류 = "info") {
  쪽지.textContent = 글;
  쪽지.className = "msg " + 종류;
  쪽지.hidden = false;
}

// 이미 로그인한 상태로 들어왔으면 바로 마이페이지로 보낸다.
현재회원().then((회원) => { if (회원) location.replace("/mypage/"); });

// 구글·카카오 동의 화면에서 취소하고 돌아온 경우 이유를 알려준다.
const 되돌아온정보 = new URLSearchParams(location.hash.slice(1));
if (되돌아온정보.get("error_description")) {
  알림(decodeURIComponent(되돌아온정보.get("error_description").replace(/\+/g, " ")), "err");
}

for (const 버튼 of 버튼들) {
  버튼.addEventListener("click", async () => {
    버튼들.forEach((b) => (b.disabled = true));
    const { error } = await 로그인(버튼.id);          // id 가 "google" / "kakao"
    if (error) {
      버튼들.forEach((b) => (b.disabled = false));
      알림(에러문구(error), "err");
    }
    // 에러가 없으면 곧 구글·카카오 화면으로 넘어간다.
  });
}
</script>
</body>
</html>
